name: Screenshot size staging benchmark

on:
  push:
    branches: [feat/screenshot-sizes]
    paths: [.github/workflows/screenshot-size-staging.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-size-staging-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'DevTech06130324/bidder-check' && github.ref == 'refs/heads/feat/screenshot-sizes' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    environment: screenshot-size-staging-benchmark
    env:
      RECEIPT: .superpowers/sdd/2026-10-12-screenshot-size-matching/hosted-receipts/linux-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.3"
          cache: npm

      - name: Verify reviewed sources
        timeout-minutes: 5
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/feat/screenshot-sizes
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check <<'CHECKSUMS'
          77c1130ff2b556dc485aa2714165d9577307cd2c3d41a2925ddc3f1c23ba666f  scripts/screenshot-size-staging-benchmark.mjs
          f1ed9908aad487d732a5886fcb994ccd678409a010628cf8320034ddb6a10a4e  scripts/screenshot-size-benchmark-plan.mjs
          19adf6da76a502badc2a949438e615f03677c0289994db2b45a8b3323dc4cec2  scripts/screenshot-size-seed-reconciliation.mjs
          9e4a3293e35b78b84152b45e00c12a04bf1eb8e16a470c4077cccb96118e4db0  package-lock.json
          CHECKSUMS
          node --version
          uname -sr

      - name: Install locked dependencies without staging credentials
        timeout-minutes: 10
        run: npm ci --ignore-scripts

      - name: Create initial cleanup plan without staging keys
        id: plan
        timeout-minutes: 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kdmvludtvhuuewmhurpw.supabase.co
        shell: bash
        run: |
          node scripts/screenshot-size-staging-benchmark.mjs --plan-only --staging-ready --receipt "$RECEIPT"
          digest=$(sha256sum "$RECEIPT" | cut -d' ' -f1)
          printf '%s\n' "$digest" > "$RECEIPT.plan-sha256.txt"
          printf 'plan_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      # An acknowledged immutable artifact is required before any staging write.
      - name: Preserve initial cleanup identities
        id: initial_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-size-initial-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RECEIPT }}
            ${{ env.RECEIPT }}.plan-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Run the complete strict matrix once
        id: benchmark
        if: success() && steps.initial_artifact.outputs.artifact-id != ''
        continue-on-error: true
        timeout-minutes: 95
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        shell: bash
        run: |
          printf '%s  %s\n' "$PLAN_SHA256" "$RECEIPT" | sha256sum --check
          set +e
          timeout --signal=TERM --kill-after=20s 90m node scripts/screenshot-size-staging-benchmark.mjs --use-plan "$RECEIPT" --staging-ready --keep-fixture
          status=$?
          printf '%s\n' "$status" > "$RECEIPT.native-exit.txt"
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Recover the exact planned fixture after failure or cancellation
        if: always() && steps.initial_artifact.outcome == 'success' && steps.benchmark.outcome != 'success'
        timeout-minutes: 65
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: timeout --signal=TERM --kill-after=20s 60m node scripts/screenshot-size-staging-benchmark.mjs --cleanup-only --staging-ready --receipt "$RECEIPT"

      - name: Preserve final receipt and native exit
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-size-final-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RECEIPT }}
            ${{ env.RECEIPT }}.used
            ${{ env.RECEIPT }}.native-exit.txt
            ${{ env.RECEIPT }}.plan-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Require the original complete pass
        if: always()
        env:
          BENCHMARK_EXIT: ${{ steps.benchmark.outputs.exit_code }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        shell: bash
        run: |
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.equal(process.env.BENCHMARK_OUTCOME, 'success');
          assert.equal(process.env.BENCHMARK_EXIT, '0');
          const receipt = JSON.parse(readFileSync(process.env.RECEIPT, 'utf8'));
          assert.equal(receipt.passed, true);
          assert.equal(receipt.failure, undefined);
          assert.equal(receipt.signupNotificationCount, 0);
          assert.equal(receipt.results.length, 21);
          assert.ok(receipt.results.every(r => r.samples === 25 && r.concurrency === 5 && r.p95Ms < 2000 && r.passed === true));
          assert.equal(receipt.fixtureRetained, true);
          assert.equal(receipt.cleanupComplete, false);
          console.log(JSON.stringify({ passed: true, cases: 21, samples: 525, fixtureRetained: true, cleanupComplete: false }));
          VERIFY
