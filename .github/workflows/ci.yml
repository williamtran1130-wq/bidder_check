name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify current complete list benchmark manifest locally
        run: node scripts/check-benchmark-manifest.mjs
      - name: Verify generated types against all executable migrations
        run: node scripts/generate-types.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and full-schema database tests
        run: npm test -- --maxWorkers=2
      - if: runner.os == 'Linux'
        run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e
